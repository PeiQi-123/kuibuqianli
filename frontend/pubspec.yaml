# Flutter项目配置文件
name: micro_exercise_frontend
description: 微运动健康管理应用

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.10.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.6
  shared_preferences: ^2.5.4
  provider: ^6.1.5
  go_router: ^12.1.3
  cupertino_icons: ^1.0.8
  fl_chart: ^0.63.0
  sensors_plus: ^4.0.2
  video_player: ^2.8.2
  url_launcher: ^6.3.0
  model_viewer_plus: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/models/human_body.glb
    - assets/models/human_body_clean.glb
    - assets/models/human_body_blue_clean.glb
    - images/background.png

