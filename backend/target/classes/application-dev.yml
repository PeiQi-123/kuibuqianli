# 开发环境配置
spring:
  main:
    allow-bean-definition-overriding: true
  
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/kuibuqianli?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5

  # HTTP编码配置
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

  # Jackson JSON 配置
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    parser:
      allow-unquoted-field-names: true
    generator:
      write-numbers-as-strings: true

  # 消息 converters
  messages:
    encoding: UTF-8

  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis配置（后续启用）
  # redis:
  #   host: localhost
  #   port: 6379
  #   password:
  #   timeout: 3000ms

